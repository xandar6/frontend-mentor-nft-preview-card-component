<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Challenge Starter</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <main class="site-main center">
      <div class="nft-card">
        <button class="nft-btn" type="button" aria-label="View NFT">
          <img src="images/image-equilibrium.jpg" alt="" class="nft-img" />
        </button>

        <div class="nft-info flow">
          <h1 class="title"><a href="#">Equlibrium #3429</a></h1>
          <p class="desc">
            Our Equlibrium collection promotes balance and calm
          </p>
          <div class="price-row">
            <span>
              <img src="images/icon-ethereum.svg" alt="Etherium" />
              <span class="nft-price">0.041ETH</span>
            </span>
            <span
              ><img src="images/icon-clock.svg" alt="clock" /><span
                >3 days left</span
              ></span
            >
          </div>
        </div>
        <hr class="rounded" />
        <div class="author">
          <img src="images/image-avatar.png" alt="author" />
          Creation of <span><a href="#">Jules Wyvern</a></span>
        </div>
      </div>
    </main>
  </body>
</html>

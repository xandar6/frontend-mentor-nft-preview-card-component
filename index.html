<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NFT Preview Card Component</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="site-main" aria-label="NFT preview card">
      <article class="nft-card">
        <a class="nft-card__media-link" href="#" aria-label="View Equilibrium #3429">
          <img
            class="nft-card__image"
            src="images/image-equilibrium.jpg"
            alt="Glass cube artwork for Equilibrium #3429"
          />
          <span class="nft-card__overlay" aria-hidden="true">
            <img src="images/icon-view.svg" alt="" />
          </span>
        </a>

        <div class="nft-card__body">
          <h1 class="nft-card__title">
            <a class="nft-card__title-link" href="#">Equilibrium #3429</a>
          </h1>

          <p class="nft-card__description">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <div class="nft-card__meta">
            <span class="nft-card__price">
              <img
                class="nft-card__icon"
                src="images/icon-ethereum.svg"
                alt=""
                aria-hidden="true"
              />
              0.041 ETH
            </span>

            <span class="nft-card__time">
              <img
                class="nft-card__icon"
                src="images/icon-clock.svg"
                alt=""
                aria-hidden="true"
              />
              3 days left
            </span>
          </div>
        </div>

        <footer class="nft-card__creator">
          <img class="nft-card__avatar" src="images/image-avatar.png" alt="" />
          <span>
            Creation of
            <a class="nft-card__creator-link" href="#">Jules Wyvern</a>
          </span>
        </footer>
      </article>
    </main>
  </body>
</html>
